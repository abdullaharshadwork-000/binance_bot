# Lint configuration. CI runs `ruff check .` — keep this file in sync with it.
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data"]

[lint]
select = [
    "E4", "E7", "E9",   # core pyflakes-class errors
    "F",                # pyflakes
    "W",                # warnings
    "I",                # import ordering
    "B",                # bugbear
    "UP",               # modernize
    "RUF",              # ruff-specific
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode: dashboard/README strings contain arrows etc.
    "RUF007",                       # zip(s, s[1:]) pairs are clearer than pairwise here
    "RUF012",                       # mutable class attributes (django-style guards not needed here)
    "UP015",                        # explicit open() modes are intentional in places
    "UP042",                        # str+Enum mixins are load-bearing for JSON/DB serialization
]

[lint.per-file-ignores]
# The dashboard is one embedded HTML/JS template string; line length there is not actionable.
"app/ui/dashboard.py" = ["E501"]
# Tests legitimately use asserts, fixtures and long parametrize lines; the repo
# style also uses compact one-liner guards in tests.
"tests/*" = ["E501", "B011", "E701"]

[lint.isort]
known-first-party = ["app"]
